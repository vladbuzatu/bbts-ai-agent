# Fire drill on STAGING: releases a deliberately broken version and passes only if the
# server's deploy gate detects it and rolls back automatically. Triggered with
# /deploy drill in Telegram.
name: deploy-drill

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rollback drill on staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/deploy.sh drill
