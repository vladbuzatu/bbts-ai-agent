# Runs on every push to main:  verify -> build images -> deploy to STAGING.
# Production is a separate, manual workflow (deploy-production.yml), triggered by
# the owner with /deploy in Telegram.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python tools
        run: pip install ruff pytest pytest-django

      - name: Playwright browser
        if: hashFiles('e2e/playwright.config.ts') != ''
        run: cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Lint, test, build
        run: bash scripts/verify.sh

      - name: Is the app deployable yet?
        id: check
        run: |
          if [ -f backend/manage.py ] && [ -f frontend/angular.json ] \
             && [ -f deploy/backend.Dockerfile ] && [ -f deploy/frontend.Dockerfile ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend or frontend not created yet - skipping build and deploy."
          fi

  build:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.repo }}/backend:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image (Angular + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          push: true
          tags: ${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: bash deploy/deploy.sh staging
